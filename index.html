<style>

select{display:block;width:100%;min-width:0;min-height:3.05rem;padding:.45rem .65rem;border:1px solid var(--line);border-radius:.42rem}
.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:.42rem;padding:.55em .86em;min-height:48px;font-weight:770;text-align:center;min-width:0}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:880}

.actions{display:flex;flex-wrap:wrap;gap:.55rem}

.quiz-header{display:grid;gap:.48rem}

progress{display:block;width:100%;height:.65rem;accent-color:var(--accent)}
.question{font-weight:870;overflow-wrap:anywhere;letter-spacing:-.027em}
fieldset{min-inline-size:0;margin:0;padding:0;border:0}

.choice:has(input:disabled){cursor:default}
.choice-text{display:block;font-weight:630}
.choice-code{font-family:ui-monospace,monospace;color:var(--accent);font-weight:870;margin-inline-end:.37em;display:inline-block}
.answer-tag{display:block;font-size:.86em;font-weight:830;color:var(--correct)}
.answer-tag.user-wrong{color:var(--wrong)}
.feedback{border:2px solid var(--accent-line);padding:1rem;background:var(--skin);border-radius:.6rem}
.feedback[data-result="wrong"]{border-style:dashed;border-color:var(--wrong)}
.feedback p{margin-top:.42rem}
.feedback .result-title{color:var(--correct)}
.feedback[data-result="wrong"] .result-title{color:var(--wrong)}
/* Evidence links stay legible without relying on color, and wrap at 200%. */
.source-ref{margin-top:.95rem;padding-top:.72rem;border-top:1px solid var(--line)}
.source-ref h4{margin:0;font-size:.9rem;color:var(--muted);font-weight:800;line-height:1.4}
.source-link{display:grid;gap:.08rem;padding:.2rem 0;min-height:48px;align-content:center;line-height:1.5;font-weight:750;overflow-wrap:anywhere;text-decoration:none}
.source-tab,.source-note{font-size:.82rem;color:var(--muted);font-weight:550}
.source-link #source-name{text-decoration:underline;text-decoration-thickness:.1em;text-underline-offset:.22em}
.source-ref .source-note{margin-top:.2rem}
.small{font-size:.82rem}
.footer{padding-block:.9rem 1rem;display:flex;flex-wrap:wrap;gap:.2rem 1rem;justify-content:space-between;border-top:1px solid var(--faint);color:var(--muted)}
.settings{border:1px solid var(--line);padding:1rem;background:var(--panel);margin-top:.78rem;border-radius:.6rem}
.settings h2{font-size:1.22rem}
.contrast-choice{display:flex;gap:.55em;align-items:center;min-height:48px;font-weight:760;cursor:pointer}
.contrast-choice input{width:1.15em;height:1.15em;flex:none;margin:0;accent-color:var(--accent)}
.pair{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))}
#result-main{font-variant-numeric:tabular-nums;font-size:1.65rem;font-weight:870}
#result-main strong{color:var(--accent)}
.hint{font-size:.84rem;color:var(--muted)}
@media (max-width:380px){.shell{padding-inline:14px}.hero,.panel,.settings,.feedback{padding:14px}.nav .button{margin-left:0}.choice{gap:.43rem;padding-inline:.45rem}.choice.selected{padding-inline:calc(.45rem - 1px)}}
@media (max-width:600px){:root[data-text="max"] .signature{grid-template-columns:1fr;min-height:0}:root[data-text="max"] .signature-mark{display:none}:root[data-text="max"] .signature-wordmark{font-size:1.34rem}}
@media (min-width:42em){main{padding-block-start:2rem}.screen{gap:1.3rem}.panel{padding:1.25rem}.hero-home .signature{margin-bottom:1rem}}
:root[data-contrast="high"] .hero-home{background:var(--panel);border-color:var(--line)}
:root[data-contrast="high"] .signature-mark{visibility:hidden}
@media (forced-colors:active){.button,.choice,.feedback,select,.panel,.hero-home{border-color:CanvasText}.choice.selected{border-color:Highlight}.choice:focus-within,:focus-visible{outline-color:Highlight}.signature-mark{visibility:hidden}}
</style>

'use strict';

  {"id":"select-043","question":"1871年、藩を廃止して府県を置き、中央政府が地方官を任命する体制へ進めた改革は？","choices":["版籍奉還","大政奉還","廃藩置県","地租改正"],"answer":2,"explanation":"廃藩置県では藩知事が免ぜられ、府県の長官を中央政府が任命するようになりました。地方支配の中央集権化を進めた改革です。","category":"歴史"},
  {"id":"select-045","question":"1885年、太政官制度に代わって内閣制度が発足した際、初代内閣総理大臣となった人物は？","choices":["伊藤博文","山県有朋","黒田清隆","松方正義"],"answer":0,"explanation":"内閣制度の発足時に首相となったのは伊藤博文です。太政官を中心とした仕組みから、内閣へ移行しました。","category":"歴史"},
  {"id":"select-048","question":"粘土板に葦の筆を押し当てて記録した、シュメール人が発達させた文字は何？","choices":["甲骨文字","ヒエログリフ","ハングル","楔形文字"],"answer":3,"explanation":"楔形文字はメソポタミアで用いられ、会計記録だけでなく法律や文学も記された。","category":"歴史"},
  {"id":"select-050","question":"1215年、ジョン王が貴族らの要求を受けて認めた、王権を制限する文書は？","choices":["権利の請願","マグナ・カルタ","権利の章典","独立宣言"],"answer":1,"explanation":"マグナ・カルタは大憲章とも呼ばれ、後の立憲政治の歴史で重要視された。","category":"歴史"},
  {"id":"select-118","question":"兵馬俑で知られる巨大な陵墓が造られた、中国を統一した秦の皇帝は？","choices":["漢の武帝","始皇帝","隋の煬帝","唐の玄宗"],"answer":1,"explanation":"秦の始皇帝の陵墓の近くには、兵士や馬をかたどった多数の陶像が埋められていました。","category":"歴史"},

  function speakAt(i) {

    const [text,lang] = phrases[i];
    const utterance = new SpeechSynthesisUtterance(text);

    utterance.onerror = () => {
      if (token === speechId) { speaking = null; button.textContent = '読み上げをもう一度試す'; }

  showSource(q.id);
  feedback.hidden = false;
  next.textContent = pos + 1 < queue.length ? '次の問題へ' : '結果を見る';
  next.hidden = false;
  $('feedback-title').focus();
}
function showResult() {
  const line = $('result-main');
  const score = document.createElement('strong'); score.textContent = String(correct);
  line.replaceChildren(score, document.createTextNode(' / ' + queue.length + ' 問 正解'));
  $('result-summary').textContent = roundMisses.length ? 'この回で間違えた問題を、そのまま解き直せます。' : 'すべて正解です。';
  $('retry-result').hidden = !roundMisses.length;
  $('replay').textContent = mode === 'retry' ? '選んだジャンルで遊ぶ' : '同じジャンルでもう一度';
  $('retry-result').textContent = '間違えた問題を解き直す（' + roundMisses.length + '問）';
  display('result','result-title');
}
form.addEventListener('submit', commit);
$('start').addEventListener('click', () => start(activeDeck(),'normal'));
homeButton.addEventListener('click', () => start([...misses].map(id => queryById.get(id)).filter(Boolean),'retry'));
$('retry-result').addEventListener('click', () => start(roundMisses,'retry'));
$('replay').addEventListener('click', () => start(activeDeck(),'normal'));
$('result-home').addEventListener('click', openHome);
$('leave').addEventListener('click', openHome);
next.addEventListener('click', () => {
  if(shown !== 'play' || !committed) return;
  if(pos + 1 < queue.length) {pos++; drawQuestion();} else {showResult();}
});
window.addEventListener('pagehide', stopSpeech);
$('settings').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); settingsOpen(false,true); }
});
applyPrefs();
initCategory();
refreshHome();
</script>
</body>
</html>
